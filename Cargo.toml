[package]
name = "langrank"
version = "0.2.9"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "A library and CLI for ranking programming languages using multiple data sources."
authors = ["hexqnt <hexqntlab@gmail.com>"]
repository = "https://github.com/hexqnt/langrank"
homepage = "https://langrank.hexq.ru"
readme = "README.md"
keywords = ["programming-language", "ranking", "cli", "benchmark", "schulze"]
categories = ["command-line-utilities"]

[features]
default = ["cli"]
cli = [
	"dep:chrono",
	"dep:clap",
	"dep:clap_complete",
	"dep:colored",
	"dep:flate2",
	"dep:indicatif",
	"dep:maud",
	"dep:minify-html",
	"dep:ndarray",
	"tokio/fs",
	"tokio/rt-multi-thread",
]

[dependencies]
anyhow = "1.0"
csv = "1.4"
memchr = "2.7"
reqwest = { version = "0.13", default-features = false, features = [
	"gzip",
	"json",
	"rustls",
	"webpki-roots",
	"socks",
] }
rustc-hash = "2.1"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = [
	"macros",
	"rt",
	"time",
] }
chrono = { version = "0.4", features = ["clock"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
colored = { version = "3.1", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }
indicatif = { version = "0.18", optional = true }
maud = { version = "0.27.0", optional = true }
minify-html = { version = "0.18.1", optional = true }
ndarray = { version = "0.17", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
	"html_reports",
] }

[[bin]]
name = "langrank"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "parsing"
harness = false

[profile.release]
strip = true
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3

[profile.profiling]
inherits = "release"
debug = 1
strip = false

# rustflags = [
# "-Ctarget-cpu=native",
# "-Ctarget-cpu=x86-64-v3",
# "-Ctarget-feature=+avx2,+fma",
# ]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
