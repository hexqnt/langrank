name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # ежедневно 02:00 UTC

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "langrank-linux-x86_64-gnu.tar.gz" \
            --dir bin
          tar -xzf bin/langrank-linux-x86_64-gnu.tar.gz -C bin

      - name: Generate report
        run: |
          rm -rf dist
          ./bin/langrank \
            --save-html dist/index.html \
            --save-rankings dist/rankings.csv \
            --save-schulze dist/schulze_rankings.csv \
            --save-benchmarks dist/benchmarksgame.csv \
            --full-output \
            --archive-csv

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ vars.CF_PAGES_PROJECT }} --branch ${{ github.event.repository.default_branch }}
